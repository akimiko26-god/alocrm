version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alocrm-postgres
    environment:
      POSTGRES_USER: alocrm
      POSTGRES_PASSWORD: alocrm_password
      POSTGRES_DB: alocrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alocrm-network

  mongodb:
    image: mongo:6.0
    container_name: alocrm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - alocrm-network

  redis:
    image: redis:7-alpine
    container_name: alocrm-redis
    ports:
      - "6379:6379"
    networks:
      - alocrm-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alocrm-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PG_HOST: postgres
      MONGO_URI: mongodb://mongodb:27017/alocrm
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - mongodb
      - redis
    volumes:
      - ./backend:/app/backend
    networks:
      - alocrm-network

volumes:
  postgres_data:
  mongo_data:

networks:
  alocrm-network:
    driver: bridge
